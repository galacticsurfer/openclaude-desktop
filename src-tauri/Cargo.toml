[package]
name = "openclaude"
version = "0.1.0"
description = "OpenClaude Desktop — unofficial open-source Claude desktop client for Linux"
authors = ["OpenClaude Desktop contributors"]
license = "Apache-2.0"
repository = "https://github.com/openclaude/openclaude-desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "openclaude_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-notification = "2.4"
tauri-plugin-window-state = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-os = "2.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
futures-util = "0.3"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }

rusqlite = { version = "0.40", features = ["bundled", "backup", "functions"] }

keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
mime_guess = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
