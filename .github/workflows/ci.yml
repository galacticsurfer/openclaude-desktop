name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npx vite build

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libsoup-3.0-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file pkg-config patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `generate_context!` needs frontendDist to exist, even for a check.
      - name: Create a placeholder dist
        run: mkdir -p dist && echo '<!doctype html><title>ci</title>' > dist/index.html

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm audit --audit-level=high || true
      # Run cargo-audit directly rather than via rustsec/audit-check, which
      # failed with "Unexpected end of JSON input" — it parses cargo-audit's
      # JSON, and gets nothing back when the advisory fetch or the install
      # goes wrong. A prebuilt binary plus a plain invocation has no such
      # failure mode, and prints output we can actually read.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file src-tauri/Cargo.lock

  bundle:
    name: Bundle (.deb + AppImage)
    runs-on: ubuntu-24.04
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libsoup-3.0-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file pkg-config patchelf desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build bundles
        # linuxdeploy is itself an AppImage and ubuntu-24.04 has no libfuse2.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx tauri build --bundles deb appimage

      - name: Validate the desktop entry
        run: |
          find src-tauri/target/release/bundle -name '*.desktop' -print0 |
            xargs -0 -r desktop-file-validate

      - uses: actions/upload-artifact@v4
        with:
          name: openclaude-linux-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
