name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and draft release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libsoup-3.0-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev \
            build-essential curl wget file pkg-config patchelf desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Check that the three version numbers agree
        run: |
          pkg=$(node -p "require('./package.json').version")
          cargo_v=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "package.json=$pkg  Cargo.toml=$cargo_v  tauri.conf.json=$conf"
          if [ "$pkg" != "$cargo_v" ] || [ "$pkg" != "$conf" ]; then
            echo "::error::version mismatch across package.json, Cargo.toml and tauri.conf.json"
            exit 1
          fi

      - name: Verify the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          [ "$pkg" = "$tag" ] || { echo "::error::tag $tag != version $pkg"; exit 1; }

      - name: Test
        run: |
          npm run typecheck && npm test
          mkdir -p dist && echo '<!doctype html><title>ci</title>' > dist/index.html
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx tauri build --bundles deb appimage

      - name: Checksums
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/deb/*.deb release/
          cp src-tauri/target/release/bundle/appimage/*.AppImage release/
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          # Drafted, never auto-published: the artifacts get a smoke test on a
          # real desktop before anyone downloads them.
          draft: true
          generate_release_notes: true
          files: release/*
